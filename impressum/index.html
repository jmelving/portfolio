<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum — Jona Melvin Grobe</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="../img/logo/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="../img/logo/favicon.svg">
  <link rel="apple-touch-icon" href="../img/logo/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/split.css">

  <!--
    Draft — Impressum in the split style.
    Paper (left) holds the title and the language switch, the ink (right) holds the legal text
    as quiet label | text rows. Phones: the paper is a strip on top that narrows as you scroll,
    the text runs underneath it.
    The legal text is the same as in impressum/index.html; it lives in TEXT below (de + en).
  -->

  <style>
    #page { display:grid; grid-template-columns:var(--seam) 1fr; min-height:100svh; }

    /* ── paper: title + language ── */
    .side {
      position:sticky; top:0; height:100svh;
      display:flex; flex-direction:column;
      padding:var(--pad);
    }
    .side h1 {
      margin-top:auto;
      font-weight:700;
      font-size:clamp(52px, calc(var(--seam) * .16), 170px);
      line-height:.84; letter-spacing:-0.055em;
    }
    .side .who { margin-top:clamp(16px, 3vh, 28px); font-size:clamp(15px, 1.15vw, 19px); }
    /* language switch: a bubble that rides the seam, like the showreel bubble on the front page.
       Solid ink with a faint ring, so its words never get split by the seam */
    #lang {
      position:fixed; top:0; left:0; z-index:7;
      width:var(--d, 112px); height:var(--d, 112px);
      margin:calc(var(--d, 112px) / -2) 0 0 calc(var(--d, 112px) / -2);
      border:0; padding:0; cursor:pointer;
      background:none; color:var(--paper);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      font:inherit;
      opacity:0; transition:opacity .8s .9s;
    }
    body.ready #lang { opacity:1; }
    #lang svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    #lang path { fill:var(--ink); transition:fill .25s ease; }   /* one solid colour: readable on either side of the seam */
    #lang { transition:opacity .8s .9s, color .25s ease; }
    /* switched (German shown): the bubble turns paper, its words ink — until you switch back */
    #lang.press { color:var(--ink); }
    #lang.press path { fill:var(--paper); }
    #lang b, #lang small { position:relative; }
    #lang small { font-size:max(11px, calc(var(--d, 112px) * .08)); line-height:1; opacity:.6; margin-bottom:3px; }
    #lang b { font-weight:600; font-size:max(15px, calc(var(--d, 112px) * .13)); letter-spacing:-0.02em; line-height:1; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
    #lang:hover b { transform:scale(1.12); }
    #lang:focus-visible { outline:none; }

    /* ── ink: the legal text ── */
    main { padding:clamp(90px, 22vh, 240px) var(--pad) var(--pad) calc(clamp(28px, 4vw, 72px) + 40px); }   /* clear of the language bubble */
    .row {
      display:grid; grid-template-columns:minmax(120px, 15ch) minmax(0, 54ch);
      gap:clamp(20px, 3vw, 56px);
      padding-block:clamp(20px, 3vh, 30px);
      border-top:1px solid rgba(238,235,229,.14);
    }
    .row:first-child { border-top:0; padding-top:0; }
    .row .label { font-size:13px; line-height:1.5; opacity:.5; padding-top:2px; }
    .row h2 { font-weight:600; font-size:clamp(19px, 1.5vw, 24px); letter-spacing:-0.02em; line-height:1.2; margin-bottom:10px; }
    .row p, .row address { font-style:normal; font-size:clamp(15px, 1.05vw, 17px); line-height:1.6; opacity:.82; }
    .row p + p { margin-top:12px; }
    .row strong { font-weight:600; opacity:1; }
    .row a { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; text-decoration-color:rgba(238,235,229,.35); transition:text-decoration-color .25s; }
    .row a:hover { text-decoration-color:currentColor; }

    footer { display:flex; justify-content:space-between; gap:20px; padding-top:clamp(60px, 12vh, 140px); font-size:12px; opacity:.45; }

    /* ── MOBILE: paper strip on top, text scrolls underneath it ── */
    @media (max-width:1024px), (hover:none) and (pointer:coarse) {
      html { background:var(--ink); }
      html, body { overflow-x:clip; max-width:100%; }
      #page { display:block; }
      .side {
        position:fixed; top:0; left:0; right:0; z-index:5;
        height:calc(var(--seam-y) - 26px);
        padding:calc(var(--pad) * 1.1) var(--pad) 10px;
      }
      .side h1 { font-size:clamp(34px, min(calc(var(--seam-y) * .3), 15.5vw), 92px); }
      .side .who { display:none; }
      #lang b { font-size:14px; }
      /* the text isn't blended here: it runs under the paper overlay, which covers it like a header */
      main.ink-text { position:relative; z-index:3; mix-blend-mode:normal; color:var(--paper); padding:calc(34svh + 28px) var(--pad) var(--pad); }
      .row { grid-template-columns:1fr; gap:8px; }
      .row:first-child { padding-top:0; }
      footer { flex-direction:column; gap:4px; padding-top:48px; }
    }
    @media (min-width:600px) and (max-width:1024px), (min-width:600px) and (hover:none) and (pointer:coarse) {
      :root { --pad:36px; }
      .row { grid-template-columns:minmax(110px, 14ch) 1fr; gap:28px; }
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <button id="lang" type="button"><svg aria-hidden="true"><path/></svg><small>Switch to</small><b></b></button>

  <div id="page">
    <aside class="side ink-text fade-in">
      <a class="back" href="../">← Back</a>
      <h1 id="title">Impressum.</h1>
      <p class="who">Jona Melvin Grobe</p>
    </aside>

    <main class="ink-text fade-in">
      <div id="rows"></div>
      <footer>
        <span>© 2026 Jona Melvin Grobe</span>
        <span>jmelving.de/impressum</span>
      </footer>
    </main>
  </div>

  <script src="../js/split-field.js"></script>
  <script>
  (() => {
    const ADDRESS = 'Ilzleite 33<br>94034 Passau';
    const MAIL = '<a href="mailto:jonamelvingrobe@gmail.com">jonamelvingrobe@gmail.com</a>';
    const WEB = '<a href="https://jmelving.de">jmelving.de</a>';
    const GH = 'https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement';

    // label (left) | optional heading + text (right)
    const TEXT = {
      de: {
        title: 'Impressum.', doc: 'Impressum',
        rows: [
          { label: 'Angaben gemäß § 5 TMG', html: `<address><strong>Jona Melvin Grobe</strong><br>Freiberuflicher 3D Generalist &amp; Technical Artist<br><br>${ADDRESS}<br>Deutschland</address>` },
          { label: 'Kontakt', html: `<p>E-Mail: ${MAIL}<br>Web: ${WEB}</p>` },
          { label: 'Steuerliche Angaben', html: `<p>Umsatzsteuer-Identifikationsnummer gemäß § 27a UStG:<br>Die Umsatzsteuer-Identifikationsnummer wird derzeit beim zuständigen Finanzamt beantragt und wird nach Erteilung hier ergänzt.</p>` },
          { label: 'Berufsbezeichnung', html: `<p>Berufsbezeichnung: <strong>Technical Artist / 3D-Generalist</strong><br>Freiberuflich tätig, nicht kammerpflichtig.</p>` },
          { label: 'Verantwortlich für den Inhalt nach § 55 Abs. 2 RStV', html: `<p>Jona Melvin Grobe<br>Ilzleite 33, 94034 Passau, Deutschland</p>` },
          { label: 'Haftungsausschluss', h: 'Haftung für Inhalte', html: `<p>Die Inhalte dieser Seite wurden mit größter Sorgfalt erstellt. Für die Richtigkeit, Vollständigkeit und Aktualität der Inhalte kann ich jedoch keine Gewähr übernehmen. Als Diensteanbieter bin ich gemäß § 7 Abs. 1 TMG für eigene Inhalte auf diesen Seiten nach den allgemeinen Gesetzen verantwortlich.</p>` },
          { label: '', h: 'Haftung für Links', html: `<p>Diese Webseite enthält Links zu externen Webseiten Dritter, auf deren Inhalte ich keinen Einfluss habe. Für die Inhalte der verlinkten Seiten ist stets der jeweilige Anbieter oder Betreiber verantwortlich.</p>` },
          { label: 'Urheberrecht', html: `<p>Die durch den Seitenbetreiber erstellten Inhalte und Werke auf diesen Seiten unterliegen dem deutschen Urheberrecht. Die Vervielfältigung, Bearbeitung, Verbreitung und jede Art der Verwertung außerhalb der Grenzen des Urheberrechts bedürfen der schriftlichen Zustimmung des jeweiligen Autors bzw. Erstellers.</p>` },
          { label: 'Datenschutz', html: `<p>Diese Website verwendet keine Cookies und erhebt keine personenbezogenen Daten. Das Hosting erfolgt über GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA). Beim Aufruf der Seite können technisch bedingt IP-Adressen im Rahmen der Server-Logs temporär verarbeitet werden. Weitere Informationen finden sich in der <a href="${GH}" target="_blank" rel="noopener">Datenschutzerklärung von GitHub</a>. Bei Fragen wenden Sie sich bitte direkt per E-Mail an mich.</p>` }
        ]
      },
      en: {
        title: 'Legal<br>Notice.', doc: 'Legal Notice',
        rows: [
          { label: 'Details pursuant to § 5 TMG (German Telemedia Act)', html: `<address><strong>Jona Melvin Grobe</strong><br>Freelance 3D Generalist &amp; Technical Artist<br><br>${ADDRESS}<br>Germany</address>` },
          { label: 'Contact', html: `<p>Email: ${MAIL}<br>Web: ${WEB}</p>` },
          { label: 'Tax information', html: `<p>VAT identification number pursuant to § 27a UStG:<br>The VAT identification number is currently being processed by the responsible tax office (Finanzamt) and will be added here once issued.</p>` },
          { label: 'Professional title', html: `<p>Professional title: <strong>Technical Artist / 3D Generalist</strong><br>Freelance activity, not subject to a professional chamber.</p>` },
          { label: 'Responsible for content pursuant to § 55 para. 2 RStV', html: `<p>Jona Melvin Grobe<br>Ilzleite 33, 94034 Passau, Germany</p>` },
          { label: 'Disclaimer', h: 'Liability for content', html: `<p>The contents of these pages were prepared with the utmost care. However, I cannot guarantee the accuracy, completeness, or topicality of the content. As a service provider, I am responsible for my own content on these pages in accordance with general law pursuant to § 7 para. 1 TMG.</p>` },
          { label: '', h: 'Liability for links', html: `<p>This website contains links to external websites of third parties whose content I have no influence over. The respective provider or operator is always responsible for the content of linked pages.</p>` },
          { label: 'Copyright', html: `<p>The content and works created by the site operator on these pages are subject to German copyright law. Reproduction, editing, distribution and any kind of use outside the limits of copyright law require the written consent of the respective author or creator.</p>` },
          { label: 'Privacy', html: `<p>This website does not use cookies and does not collect personal data. Hosting is provided via GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. St., San Francisco, CA 94107, USA). When visiting the site, IP addresses may be temporarily processed in server logs for technical reasons. For more information see <a href="${GH}" target="_blank" rel="noopener">GitHub's Privacy Statement</a>. For any privacy-related questions, please contact me directly by email.</p>` }
        ]
      }
    };

    const field = SplitField.init({ split: 0.42, splitMobile: 0.34, mobileAxis: 'y', enterFrom: 0.5, lavaOver: PHONE_LAYOUT() });

    const rows = document.getElementById('rows');
    const title = document.getElementById('title');
    const bubble = document.getElementById('lang');
    const side = document.querySelector('.side');
    const shape = bubble.querySelector('path');
    const OTHER = { de: { word: 'English', lang: 'en' }, en: { word: 'German', lang: 'de' } };
    let current = null;
    function render(lang) {
      const T = TEXT[lang];
      document.documentElement.lang = lang;
      document.title = `${T.doc} — Jona Melvin Grobe`;
      title.innerHTML = T.title;
      rows.innerHTML = T.rows.map(r => `
        <section class="row">
          <p class="label">${r.label}</p>
          <div>${r.h ? `<h2>${r.h}</h2>` : ''}${r.html}</div>
        </section>`).join('');
      // the bubble offers the other language
      const o = OTHER[lang];
      bubble.querySelector('b').textContent = o.word;
      bubble.setAttribute('lang', o.lang);
      bubble.setAttribute('aria-label', lang === 'de' ? 'Switch to English' : 'Auf Deutsch umschalten');
    }
    function setLang(lang, animate = true) {
      if (lang === current) return;
      current = lang;
      bubble.classList.toggle('press', lang === 'de');
      history.replaceState(null, '', lang === 'de' ? '#de' : location.pathname);
      if (!animate) return render(lang);
      render(lang);
      if (!matchMedia('(prefers-reduced-motion:reduce)').matches) decode([title, ...rows.querySelectorAll('.row'), bubble.querySelector('b')]);
    }

    // translation effect: the new words decode out of scrambled letters, left to right, one row after another.
    // Spaces and punctuation stay put, so the lines keep their shape and nothing jumps around.
    const GLYPHS = 'abcdeghknopqrsuvxyz';             // letters of about average width, so lines keep their length
    let decodeRun = 0;
    function decode(blocks) {
      const run = ++decodeRun;
      const jobs = [];
      // every row keeps its final height while it decodes, so nothing below it twitches
      const rowEls = blocks.filter(el => el.classList && el.classList.contains('row'));
      rowEls.forEach(r => { r.style.height = r.offsetHeight + 'px'; });
      const release = () => rowEls.forEach(r => { r.style.height = ''; });
      blocks.forEach((el, k) => {
        const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        let off = 0, n;
        while ((n = walk.nextNode())) {
          const text = n.nodeValue;
          if (!text.trim()) continue;
          jobs.push({ n, text, start: k * 55 + off * 4, len: text.length });   // later rows and later words start a bit later
          off += text.length;
        }
      });
      const rnd = ch => {
        if (/\d/.test(ch)) return String(Math.floor(Math.random() * 10));
        if (!/\p{L}/u.test(ch)) return ch;
        const g = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        return ch === ch.toUpperCase() ? g.toUpperCase() : g;
      };
      const t0 = performance.now();
      let last = -1;
      (function step(now) {
        if (run !== decodeRun) return release();
        const t = now - t0;
        const tick = Math.floor(t / 45);                // fresh noise ~22×/s, not every frame
        if (tick !== last) {
          last = tick;
          let busy = false;
          jobs.forEach(j => {
            const dur = Math.min(520, 160 + j.len * 5);
            const p = (t - j.start) / dur;              // how far along this piece of text the decoded front is
            if (p >= 1) { if (j.n.nodeValue !== j.text) j.n.nodeValue = j.text; return; }
            busy = true;
            const front = Math.max(0, Math.floor(p * j.len));
            let out = j.text.slice(0, front);
            for (let i = front; i < j.len; i++) out += rnd(j.text[i]);
            j.n.nodeValue = out;
          });
          if (!busy) return release();
        }
        requestAnimationFrame(step);
      })(t0);
    }
    bubble.addEventListener('click', () => setLang(current === 'de' ? 'en' : 'de'));
    // starts in English; a link ending in #de opens the German version
    const first = location.hash === '#de' ? 'de' : 'en';
    setLang(first, false);

    // the bubble rides the seam with a slightly wobbly outline; grows a touch on hover, pops on click
    let hover = false, rad = 0, pop = 0;
    bubble.addEventListener('pointerenter', () => { hover = true; });
    bubble.addEventListener('pointerleave', () => { hover = false; });
    bubble.addEventListener('click', () => { pop = 1; });
    const t0 = performance.now();
    (function ride(now) {
      const t = (now - t0) / 1000 || 0;
      const mobile = PHONE_LAYOUT();
      const base = mobile ? Math.min(42, innerWidth * 0.105) : Math.max(46, Math.min(innerWidth * 0.036, 64));
      pop *= 0.9;
      rad += ((hover ? base * 1.12 : base) * (1 - pop * 0.18) - rad) * 0.14;
      let x, y;
      if (mobile) { x = innerWidth - parseFloat(getComputedStyle(side).paddingRight) - base; y = field.edgeAt(x); }
      else { y = innerHeight * 0.5; x = field.edgeAt(y); }
      const box = Math.ceil(base * 2.6);
      bubble.style.setProperty('--d', box + 'px');
      bubble.style.translate = `${x.toFixed(1)}px ${y.toFixed(1)}px`;
      let d = '';
      for (let i = 0; i < 64; i++) {
        const a = i / 64 * Math.PI * 2;
        const rr = rad * (1 + 0.035 * Math.sin(3 * a + t * 0.9) + 0.025 * Math.sin(5 * a - t * 1.3));
        d += (i ? 'L' : 'M') + (box / 2 + Math.cos(a) * rr).toFixed(1) + ' ' + (box / 2 + Math.sin(a) * rr).toFixed(1);
      }
      shape.setAttribute('d', d + 'Z');
      requestAnimationFrame(ride);
    })(t0);

    // phones: the paper strip starts roomy for the title and narrows once you read on
    let q = false;
    const narrow = () => {
      q = false;
      if (!PHONE_LAYOUT()) return;
      const p = Math.min(1, scrollY / (innerHeight * 0.3));
      field.setSplitMobile(0.34 - 0.14 * p * p * (3 - 2 * p));
    };
    addEventListener('scroll', () => { if (!q) { q = true; requestAnimationFrame(narrow); } }, { passive: true });
    addEventListener('resize', narrow);
    narrow();
  })();
  </script>
</body>
</html>
