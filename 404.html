<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — Jona Melvin Grobe</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/logo/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/img/logo/favicon.svg">
  <link rel="apple-touch-icon" href="/img/logo/apple-touch-icon.png">

  <!-- GitHub Pages serves this for any missing address, at any depth — so every path here is absolute. -->
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/split.css">

  <style>
    #page { display:grid; grid-template-columns:var(--seam) 1fr; min-height:100svh; }

    /* paper: the number */
    .side { position:sticky; top:0; height:100svh; display:flex; flex-direction:column; padding:var(--pad); }
    .side h1 {
      margin-top:auto;
      font-weight:700;
      font-size:clamp(90px, calc(var(--seam) * .3), 300px);
      line-height:.84; letter-spacing:-0.06em;
    }
    .side .who { margin-top:clamp(16px, 3vh, 28px); font-size:clamp(15px, 1.15vw, 19px); }

    /* ink: what happened + where to go */
    main { display:flex; flex-direction:column; justify-content:center; padding:var(--pad) var(--pad) var(--pad) clamp(56px, 8vw, 150px); }   /* well clear of the wave's swing */
    main p { max-width:34ch; font-size:clamp(19px, 1.6vw, 28px); line-height:1.3; letter-spacing:-0.01em; }
    main p small { display:block; margin-top:14px; font-size:clamp(14px, 1vw, 16px); letter-spacing:0; opacity:.55; }
    nav { display:flex; flex-wrap:wrap; gap:10px 28px; margin-top:clamp(36px, 7vh, 72px); font-size:clamp(17px, 1.3vw, 22px); }
    nav a { text-decoration:none; opacity:.6; transition:opacity .25s; }
    nav a:hover, nav a:first-child { opacity:1; }
    nav a i { font-style:normal; display:inline-block; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
    nav a:hover i { transform:translateX(4px); }

    /* phones: paper strip on top, the rest underneath */
    @media (max-width:1024px), (hover:none) and (pointer:coarse) {
      html { background:var(--ink); }
      #page { display:block; }
      .side { position:fixed; top:0; left:0; right:0; z-index:5; height:calc(var(--seam-y) - 26px); padding:calc(var(--pad) * 1.1) var(--pad) 10px; }
      .side h1 { font-size:clamp(64px, min(calc(var(--seam-y) * .42), 30vw), 160px); }
      .side .who { display:none; }
      main.ink-text { position:relative; z-index:3; mix-blend-mode:normal; color:var(--paper); min-height:100svh; justify-content:flex-start; padding:calc(var(--seam-y, 34svh) + 36px) var(--pad) var(--pad); }   /* starts below the paper strip */
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <div id="page">
    <aside class="side ink-text fade-in">
      <a class="back" href="/">← Home</a>
      <h1>404.</h1>
      <p class="who">Page not found</p>
    </aside>

    <main class="ink-text fade-in">
      <p>This page doesn’t exist.
        <small>Probably one from the large dataset of my mistakes.</small></p>
      <nav>
        <a href="/">Home <i>→</i></a>
        <a href="/projects/">Projects <i>→</i></a>
        <a href="/curiosities/">Curiosities <i>→</i></a>
      </nav>
    </main>
  </div>

  <script src="/js/split-field.js"></script>
  <script>
    SplitField.init({ split: 0.42, splitMobile: 0.34, mobileAxis: 'y', enterFrom: 0.5, lavaOver: PHONE_LAYOUT() });
  </script>
</body>
</html>
