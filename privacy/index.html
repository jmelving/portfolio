<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — Jona Melvin Grobe</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="../img/logo/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="../img/logo/favicon.svg">
  <link rel="apple-touch-icon" href="../img/logo/apple-touch-icon.png">

  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/split.css">

  <!-- Privacy policy (Datenschutzerklärung), same layout as the imprint: paper = title + language,
       ink = label | text rows. The text lives in TEXT below (de + en). -->

  <style>
    #page { display:grid; grid-template-columns:var(--seam) 1fr; min-height:100svh; }

    /* ── paper: title + language ── */
    .side {
      position:sticky; top:0; height:100svh;
      display:flex; flex-direction:column;
      padding:var(--pad);
    }
    .side h1 {
      margin-top:auto;
      font-weight:700;
      font-size:clamp(52px, calc(var(--seam) * .16), 170px);
      line-height:.84; letter-spacing:-0.055em;
    }
    .side .who { margin-top:clamp(16px, 3vh, 28px); font-size:clamp(15px, 1.15vw, 19px); }
    /* language switch: a bubble that rides the seam, like the showreel bubble on the front page.
       Solid ink with a faint ring, so its words never get split by the seam */
    #lang {
      position:fixed; top:0; left:0; z-index:7;
      width:var(--d, 112px); height:var(--d, 112px);
      margin:calc(var(--d, 112px) / -2) 0 0 calc(var(--d, 112px) / -2);
      border:0; padding:0; cursor:pointer;
      background:none; color:var(--paper);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      font:inherit;
      opacity:0; transition:opacity .8s .9s;
    }
    body.ready #lang { opacity:1; }
    #lang svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    #lang path { fill:var(--ink); transition:fill .25s ease; }   /* one solid colour: readable on either side of the seam */
    #lang { transition:opacity .8s .9s, color .25s ease; }
    /* switched (German shown): the bubble turns paper, its words ink — until you switch back */
    #lang.press { color:var(--ink); }
    #lang.press path { fill:var(--paper); }
    #lang b, #lang small { position:relative; }
    #lang small { font-size:max(11px, calc(var(--d, 112px) * .08)); line-height:1; opacity:.6; margin-bottom:3px; }
    #lang b { font-weight:600; font-size:max(15px, calc(var(--d, 112px) * .13)); letter-spacing:-0.02em; line-height:1; transition:transform .5s cubic-bezier(.2,.7,.2,1); }
    #lang:hover b { transform:scale(1.12); }
    #lang:focus-visible { outline:none; }

    /* ── ink: the legal text ── */
    main { padding:clamp(90px, 22vh, 240px) var(--pad) var(--pad) calc(clamp(28px, 4vw, 72px) + 40px); }   /* clear of the language bubble */
    .row {
      display:grid; grid-template-columns:minmax(120px, 15ch) minmax(0, 54ch);
      gap:clamp(20px, 3vw, 56px);
      padding-block:clamp(20px, 3vh, 30px);
      border-top:1px solid rgba(238,235,229,.14);
    }
    .row:first-child { border-top:0; padding-top:0; }
    .row .label { font-size:13px; line-height:1.5; opacity:.5; padding-top:2px; }
    .row h2 { font-weight:600; font-size:clamp(19px, 1.5vw, 24px); letter-spacing:-0.02em; line-height:1.2; margin-bottom:10px; }
    .row p, .row address { font-style:normal; font-size:clamp(15px, 1.05vw, 17px); line-height:1.6; opacity:.82; }
    .row p + p { margin-top:12px; }
    .row strong { font-weight:600; opacity:1; }
    .row a { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; text-decoration-color:rgba(238,235,229,.35); transition:text-decoration-color .25s; }
    .row a:hover { text-decoration-color:currentColor; }

    footer { display:flex; justify-content:space-between; gap:20px; padding-top:clamp(60px, 12vh, 140px); font-size:12px; opacity:.45; }

    /* ── MOBILE: paper strip on top, text scrolls underneath it ── */
    @media (max-width:1024px), (hover:none) and (pointer:coarse) {
      html { background:var(--ink); }
      html, body { overflow-x:clip; max-width:100%; }
      #page { display:block; }
      .side {
        position:fixed; top:0; left:0; right:0; z-index:5;
        height:calc(var(--seam-y) - 26px);
        padding:calc(var(--pad) * 1.1) var(--pad) 10px;
      }
      .side h1 { font-size:clamp(34px, min(calc(var(--seam-y) * .3), 15.5vw), 92px); }
      .side .who { display:none; }
      #lang b { font-size:14px; }
      /* the text isn't blended here: it runs under the paper overlay, which covers it like a header */
      main.ink-text { position:relative; z-index:3; mix-blend-mode:normal; color:var(--paper); padding:calc(34svh + 28px) var(--pad) var(--pad); }
      .row { grid-template-columns:1fr; gap:8px; }
      .row:first-child { padding-top:0; }
      footer { flex-direction:column; gap:4px; padding-top:48px; }
    }
    @media (min-width:600px) and (max-width:1024px), (min-width:600px) and (hover:none) and (pointer:coarse) {
      :root { --pad:36px; }
      .row { grid-template-columns:minmax(110px, 14ch) 1fr; gap:28px; }
    }
  </style>
  <script defer src="../js/mail-copy.js"></script>
</head>

<body>
  <div class="grain"></div>

  <button id="lang" type="button"><svg aria-hidden="true"><path/></svg><small>Switch to</small><b></b></button>

  <div id="page">
    <aside class="side ink-text fade-in">
      <a class="back" href="../">← Back</a>
      <h1 id="title">Privacy<br>Policy.</h1>
      <p class="who">Jona Melvin Grobe</p>
    </aside>

    <main class="ink-text fade-in">
      <div id="rows"></div>
      <footer>
        <span>© 2026 Jona Melvin Grobe</span>
        <a href="../impressum/">Impressum</a>
      </footer>
    </main>
  </div>

  <script src="../js/split-field.js"></script>
  <script>
  (() => {
    const ADDRESS = 'Ilzleite 33<br>94034 Passau';
    const MAIL = '<a href="mailto:jonamelvingrobe@gmail.com">jonamelvingrobe@gmail.com</a>';
    const ext = (href, label) => `<a href="${href}" target="_blank" rel="noopener">${label}</a>`;
    const GH = 'https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement';
    const GOOGLE = 'https://policies.google.com/privacy';
    const VIMEO = 'https://vimeo.com/privacy';
    const SPOTIFY = 'https://www.spotify.com/legal/privacy-policy/';
    const BAYLDA = 'https://www.lda.bayern.de';

    // label (left) | optional heading + text (right)
    const TEXT = {
      de: {
        title: 'Daten&shy;schutz.', doc: 'Datenschutzerklärung',
        rows: [
          { label: 'Verantwortlicher', html: `<p>Verantwortlich für die Datenverarbeitung auf dieser Website im Sinne der Datenschutz-Grundverordnung (DSGVO):</p><address><strong>Jona Melvin Grobe</strong><br>${ADDRESS}<br>Deutschland<br>E-Mail: ${MAIL}</address>` },
          { label: 'Überblick', html: `<p>Diese Website ist mein persönliches Portfolio. Sie setzt keine Cookies, nutzt keine Analyse- oder Tracking-Werkzeuge und zeigt keine Werbung. Personenbezogene Daten werden nur verarbeitet, soweit das technisch nötig ist, um die Seite auszuliefern, wenn Sie mir schreiben, oder wenn Sie Inhalte eines Drittanbieters (Videos, Musik) bewusst per Klick laden.</p>` },
          { label: 'Hosting', h: 'GitHub Pages', html: `<p>Die Website wird bei GitHub Pages gehostet (GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA). Beim Aufruf der Seiten verarbeitet GitHub technisch notwendige Daten in Server-Logfiles, insbesondere Ihre IP-Adresse, Datum und Uhrzeit des Zugriffs, die aufgerufene Seite, die zuvor besuchte Seite (Referrer) sowie Browser und Betriebssystem.</p><p>Das ist nötig, um die Website sicher und stabil auszuliefern. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO; mein berechtigtes Interesse liegt in einer zuverlässigen Darstellung der Seite. Die Daten können in die USA übermittelt werden. GitHub ist nach dem EU-US Data Privacy Framework zertifiziert, für das ein Angemessenheitsbeschluss der EU-Kommission besteht (Art. 45 DSGVO). Ich selbst habe keinen Zugriff auf diese Logfiles. Mehr dazu in der ${ext(GH, 'Datenschutzerklärung von GitHub')}.</p>` },
          { label: 'Kontakt', h: 'Per E-Mail', html: `<p>Wenn Sie mir eine E-Mail schreiben, verarbeite ich Ihre Adresse, Ihren Namen und den Inhalt Ihrer Nachricht, um Ihre Anfrage zu beantworten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO, wenn es um ein mögliches Projekt oder einen Vertrag geht, sonst Art. 6 Abs. 1 lit. f DSGVO (Interesse an der Beantwortung von Anfragen). Ich lösche die Nachrichten, sobald sie nicht mehr gebraucht werden, sofern keine gesetzlichen Aufbewahrungspflichten bestehen.</p><p>Für mein Postfach nutze ich Gmail (Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland). Dabei kann eine Übermittlung an Google LLC in den USA erfolgen; Google ist nach dem EU-US Data Privacy Framework zertifiziert. Siehe ${ext(GOOGLE, 'Datenschutzerklärung von Google')}.</p><p>Ein Klick auf „Get in touch“ kopiert meine E-Mail-Adresse in Ihre Zwischenablage. Das passiert nur lokal in Ihrem Browser, dabei wird nichts übertragen.</p>` },
          { label: 'Schriftarten', html: `<p>Die Schriftart DM Sans liegt direkt auf diesem Server. Beim Laden der Seite wird keine Verbindung zu Google Fonts oder anderen Anbietern aufgebaut.</p>` },
          { label: 'Eingebettete Inhalte', h: 'Erst nach Ihrem Klick', html: `<p>Videos und Musik von Drittanbietern werden nicht automatisch geladen. Erst wenn Sie auf „Watch“ bzw. „Play on Spotify“ klicken, wird eine Verbindung zum jeweiligen Anbieter hergestellt. Dabei werden mindestens Ihre IP-Adresse und technische Angaben zu Ihrem Browser übertragen; der Anbieter kann außerdem Cookies oder ähnliche Technologien einsetzen. Rechtsgrundlage ist Ihre Einwilligung durch den Klick (Art. 6 Abs. 1 lit. a DSGVO, § 25 Abs. 1 TDDDG). Sie können sie jederzeit widerrufen, indem Sie die Seite neu laden. Ab dann wird nichts mehr geladen.</p>` },
          { label: '', h: 'YouTube', html: `<p>Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland. Ich nutze den erweiterten Datenschutzmodus (youtube-nocookie.com). Eine Übermittlung in die USA ist möglich; Google ist nach dem EU-US Data Privacy Framework zertifiziert. ${ext(GOOGLE, 'Datenschutzerklärung von Google')}.</p>` },
          { label: '', h: 'Vimeo', html: `<p>Vimeo.com, Inc., 330 West 34th Street, 5th Floor, New York, NY 10001, USA. Eine Übermittlung in die USA findet statt. ${ext(VIMEO, 'Datenschutzerklärung von Vimeo')}.</p>` },
          { label: '', h: 'Spotify', html: `<p>Spotify AB, Regeringsgatan 19, 111 53 Stockholm, Schweden. ${ext(SPOTIFY, 'Datenschutzerklärung von Spotify')}.</p>` },
          { label: 'Links', html: `<p>Diese Website verlinkt auf externe Seiten, zum Beispiel meine Profile bei YouTube, Instagram, GitHub und LinkedIn. Solange Sie einen Link nicht anklicken, werden keine Daten an diese Anbieter übertragen. Nach dem Klick gilt die Datenschutzerklärung des jeweiligen Anbieters.</p>` },
          { label: 'Ihre Rechte', html: `<p>Sie haben das Recht auf Auskunft über Ihre bei mir gespeicherten Daten (Art. 15 DSGVO), auf Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18) und Datenübertragbarkeit (Art. 20). Einer Verarbeitung auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO können Sie widersprechen (Art. 21). Eine erteilte Einwilligung können Sie jederzeit für die Zukunft widerrufen (Art. 7 Abs. 3). Schreiben Sie mir dazu einfach eine E-Mail.</p><p>Außerdem können Sie sich bei einer Datenschutz-Aufsichtsbehörde beschweren (Art. 77 DSGVO). Für mich zuständig ist das Bayerische Landesamt für Datenschutzaufsicht, Promenade 18, 91522 Ansbach, ${ext(BAYLDA, 'lda.bayern.de')}.</p>` },
          { label: 'Stand', html: `<p>November 2026</p>` }
        ]
      },
      en: {
        title: 'Privacy<br>Policy.', doc: 'Privacy Policy',
        rows: [
          { label: 'Controller', html: `<p>Responsible for data processing on this website within the meaning of the General Data Protection Regulation (GDPR):</p><address><strong>Jona Melvin Grobe</strong><br>${ADDRESS}<br>Germany<br>Email: ${MAIL}</address>` },
          { label: 'Overview', html: `<p>This website is my personal portfolio. It sets no cookies, uses no analytics or tracking tools and shows no ads. Personal data is only processed where it is technically necessary to deliver the site, when you write to me, or when you deliberately load third-party content (videos, music) with a click.</p>` },
          { label: 'Hosting', h: 'GitHub Pages', html: `<p>This website is hosted on GitHub Pages (GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA). When you visit, GitHub processes technically necessary data in server log files, in particular your IP address, the date and time of access, the page requested, the referring page, and your browser and operating system.</p><p>This is needed to deliver the website securely and reliably. The legal basis is Art. 6(1)(f) GDPR; my legitimate interest is a reliable presentation of the site. Data may be transferred to the USA. GitHub is certified under the EU-US Data Privacy Framework, which is covered by an adequacy decision of the European Commission (Art. 45 GDPR). I have no access to these log files myself. See ${ext(GH, "GitHub's Privacy Statement")}.</p>` },
          { label: 'Contact', h: 'By email', html: `<p>If you email me, I process your address, your name and the content of your message to answer your request. The legal basis is Art. 6(1)(b) GDPR where it concerns a possible project or contract, otherwise Art. 6(1)(f) GDPR (interest in answering enquiries). I delete messages once they are no longer needed, unless statutory retention periods apply.</p><p>My mailbox runs on Gmail (Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland). Data may be transferred to Google LLC in the USA; Google is certified under the EU-US Data Privacy Framework. See ${ext(GOOGLE, "Google's Privacy Policy")}.</p><p>Clicking “Get in touch” copies my email address to your clipboard. This happens only locally in your browser; nothing is sent.</p>` },
          { label: 'Fonts', html: `<p>The DM Sans typeface is served directly from this server. Loading the site makes no connection to Google Fonts or any other provider.</p>` },
          { label: 'Embedded content', h: 'Only after your click', html: `<p>Videos and music from third parties are not loaded automatically. Only when you click “Watch” or “Play on Spotify” is a connection made to the respective provider. At least your IP address and technical details about your browser are transmitted, and the provider may use cookies or similar technologies. The legal basis is your consent given by the click (Art. 6(1)(a) GDPR, § 25(1) TDDDG). You can withdraw it at any time by reloading the page; nothing is loaded after that.</p>` },
          { label: '', h: 'YouTube', html: `<p>Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland. I use the privacy-enhanced mode (youtube-nocookie.com). Data may be transferred to the USA; Google is certified under the EU-US Data Privacy Framework. ${ext(GOOGLE, "Google's Privacy Policy")}.</p>` },
          { label: '', h: 'Vimeo', html: `<p>Vimeo.com, Inc., 330 West 34th Street, 5th Floor, New York, NY 10001, USA. Data is transferred to the USA. ${ext(VIMEO, "Vimeo's Privacy Policy")}.</p>` },
          { label: '', h: 'Spotify', html: `<p>Spotify AB, Regeringsgatan 19, 111 53 Stockholm, Sweden. ${ext(SPOTIFY, "Spotify's Privacy Policy")}.</p>` },
          { label: 'Links', html: `<p>This website links to external sites, for example my profiles on YouTube, Instagram, GitHub and LinkedIn. No data is sent to these providers unless you click a link. After the click, the respective provider's privacy policy applies.</p>` },
          { label: 'Your rights', html: `<p>You have the right of access to the data I hold about you (Art. 15 GDPR), to rectification (Art. 16), erasure (Art. 17), restriction of processing (Art. 18) and data portability (Art. 20). You may object to processing based on Art. 6(1)(f) GDPR (Art. 21). You can withdraw consent at any time with effect for the future (Art. 7(3)). Just send me an email.</p><p>You also have the right to lodge a complaint with a data protection supervisory authority (Art. 77 GDPR). The authority responsible for me is the Bavarian State Office for Data Protection Supervision (BayLDA), Promenade 18, 91522 Ansbach, Germany, ${ext(BAYLDA, 'lda.bayern.de')}.</p>` },
          { label: 'Last updated', html: `<p>November 2026</p>` }
        ]
      }
    };

    const field = SplitField.init({ split: 0.42, splitMobile: 0.34, mobileAxis: 'y', enterFrom: 0.5, lavaOver: PHONE_LAYOUT() });

    const rows = document.getElementById('rows');
    const title = document.getElementById('title');
    const bubble = document.getElementById('lang');
    const side = document.querySelector('.side');
    const shape = bubble.querySelector('path');
    const OTHER = { de: { word: 'English', lang: 'en' }, en: { word: 'German', lang: 'de' } };
    let current = null;
    function render(lang) {
      const T = TEXT[lang];
      document.documentElement.lang = lang;
      document.title = `${T.doc} — Jona Melvin Grobe`;
      title.innerHTML = T.title;
      rows.innerHTML = T.rows.map(r => `
        <section class="row">
          <p class="label">${r.label}</p>
          <div>${r.h ? `<h2>${r.h}</h2>` : ''}${r.html}</div>
        </section>`).join('');
      // the bubble offers the other language
      const o = OTHER[lang];
      bubble.querySelector('b').textContent = o.word;
      bubble.setAttribute('lang', o.lang);
      bubble.setAttribute('aria-label', lang === 'de' ? 'Switch to English' : 'Auf Deutsch umschalten');
    }
    function setLang(lang, animate = true) {
      if (lang === current) return;
      current = lang;
      bubble.classList.toggle('press', lang === 'de');
      history.replaceState(null, '', lang === 'de' ? '#de' : location.pathname);
      if (!animate) return render(lang);
      render(lang);
      if (!matchMedia('(prefers-reduced-motion:reduce)').matches) decode([title, ...rows.querySelectorAll('.row'), bubble.querySelector('b')]);
    }

    // translation effect: the new words decode out of scrambled letters, left to right, one row after another.
    // Spaces and punctuation stay put, so the lines keep their shape and nothing jumps around.
    const GLYPHS = 'abcdeghknopqrsuvxyz';             // letters of about average width, so lines keep their length
    let decodeRun = 0;
    function decode(blocks) {
      const run = ++decodeRun;
      const jobs = [];
      // every row keeps its final height while it decodes, so nothing below it twitches
      const rowEls = blocks.filter(el => el.classList && el.classList.contains('row'));
      rowEls.forEach(r => { r.style.height = r.offsetHeight + 'px'; });
      const release = () => rowEls.forEach(r => { r.style.height = ''; });
      blocks.forEach((el, k) => {
        const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        let off = 0, n;
        while ((n = walk.nextNode())) {
          const text = n.nodeValue;
          if (!text.trim()) continue;
          jobs.push({ n, text, start: k * 55 + off * 4, len: text.length });   // later rows and later words start a bit later
          off += text.length;
        }
      });
      const rnd = ch => {
        if (/\d/.test(ch)) return String(Math.floor(Math.random() * 10));
        if (!/\p{L}/u.test(ch)) return ch;
        const g = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        return ch === ch.toUpperCase() ? g.toUpperCase() : g;
      };
      const t0 = performance.now();
      let last = -1;
      (function step(now) {
        if (run !== decodeRun) return release();
        const t = now - t0;
        const tick = Math.floor(t / 45);                // fresh noise ~22×/s, not every frame
        if (tick !== last) {
          last = tick;
          let busy = false;
          jobs.forEach(j => {
            const dur = Math.min(520, 160 + j.len * 5);
            const p = (t - j.start) / dur;              // how far along this piece of text the decoded front is
            if (p >= 1) { if (j.n.nodeValue !== j.text) j.n.nodeValue = j.text; return; }
            busy = true;
            const front = Math.max(0, Math.floor(p * j.len));
            let out = j.text.slice(0, front);
            for (let i = front; i < j.len; i++) out += rnd(j.text[i]);
            j.n.nodeValue = out;
          });
          if (!busy) return release();
        }
        requestAnimationFrame(step);
      })(t0);
    }
    bubble.addEventListener('click', () => setLang(current === 'de' ? 'en' : 'de'));
    // starts in English; a link ending in #de opens the German version
    const first = location.hash === '#de' ? 'de' : 'en';
    setLang(first, false);

    // the bubble rides the seam with a slightly wobbly outline; grows a touch on hover, pops on click
    let hover = false, rad = 0, pop = 0;
    bubble.addEventListener('pointerenter', () => { hover = true; });
    bubble.addEventListener('pointerleave', () => { hover = false; });
    bubble.addEventListener('click', () => { pop = 1; });
    const t0 = performance.now();
    (function ride(now) {
      const t = (now - t0) / 1000 || 0;
      const mobile = PHONE_LAYOUT();
      const base = mobile ? Math.min(42, innerWidth * 0.105) : Math.max(46, Math.min(innerWidth * 0.036, 64));
      pop *= 0.9;
      rad += ((hover ? base * 1.12 : base) * (1 - pop * 0.18) - rad) * 0.14;
      let x, y;
      if (mobile) { x = innerWidth - parseFloat(getComputedStyle(side).paddingRight) - base; y = field.edgeAt(x); }
      else { y = innerHeight * 0.5; x = field.edgeAt(y); }
      const box = Math.ceil(base * 2.6);
      bubble.style.setProperty('--d', box + 'px');
      bubble.style.translate = `${x.toFixed(1)}px ${y.toFixed(1)}px`;
      let d = '';
      for (let i = 0; i < 64; i++) {
        const a = i / 64 * Math.PI * 2;
        const rr = rad * (1 + 0.035 * Math.sin(3 * a + t * 0.9) + 0.025 * Math.sin(5 * a - t * 1.3));
        d += (i ? 'L' : 'M') + (box / 2 + Math.cos(a) * rr).toFixed(1) + ' ' + (box / 2 + Math.sin(a) * rr).toFixed(1);
      }
      shape.setAttribute('d', d + 'Z');
      requestAnimationFrame(ride);
    })(t0);

    // phones: the paper strip starts roomy for the title and narrows once you read on
    let q = false;
    const narrow = () => {
      q = false;
      if (!PHONE_LAYOUT()) return;
      const p = Math.min(1, scrollY / (innerHeight * 0.3));
      field.setSplitMobile(0.34 - 0.14 * p * p * (3 - 2 * p));
    };
    addEventListener('scroll', () => { if (!q) { q = true; requestAnimationFrame(narrow); } }, { passive: true });
    addEventListener('resize', narrow);
    narrow();
  })();
  </script>
</body>
</html>
