<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Jona Melvin Grobe</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/split.css">

  <!--
    Draft — projects overview in the front-page style.
    The black half was "Projects" on the front page, so here the black takes over:
    the seam slides from the middle to a narrow paper strip on the left.
    Thumbnails + the Lab library (masonry + lightbox) work like on the current page.
    Content comes from projects.data.js (same file the current page uses).
  -->

  <style>
    #page {
      display:grid;
      grid-template-columns:var(--seam) 1fr;
      min-height:100svh;
    }

    /* ── paper strip: what / filters ── */
    .strip {
      position:sticky; top:0;
      height:100svh;
      display:flex; flex-direction:column;
      padding:var(--pad);
      padding-right:clamp(18px, 2vw, 36px);
    }
    .strip h1 {
      margin-top:auto;
      font-weight:700;
      font-size:clamp(38px, min(4.6vw, 9vh), 92px);
      line-height:.9;
      letter-spacing:-0.04em;
    }
    .strip .count { margin-top:14px; font-size:14px; opacity:.55; }
    .filters { list-style:none; margin-top:clamp(24px, 5vh, 56px); display:flex; flex-direction:column; gap:4px; }
    .filters button {
      font:inherit; font-size:clamp(15px, 1.1vw, 18px);
      color:inherit; background:none; border:0; cursor:pointer;
      text-align:left; padding:2px 0;
      opacity:.45; transition:opacity .25s;
    }
    .filters button:hover { opacity:.8; }
    .filters button.on { opacity:1; }
    .filters button.on::before { content:'→ '; }
    .to-lab { margin-top:auto; font-size:14px; text-decoration:none; opacity:.6; }
    .to-lab:hover { opacity:1; }

    /* the work runs edge to edge at the top and right; on the left it keeps clear of the wave */
    /* --gap: breathing room between the wave and the gallery; the lab sits further in */
    :root { --gap:2.6vw; --inset:clamp(28px, 4vw, 72px); }
    main { padding-left:var(--gap); min-width:0; }
    #lab { padding:0 var(--pad) 0 calc(var(--inset) - var(--gap) + 1vw); }

    /* ── project gallery: same as the current page (3 columns, 2px gaps, title slides in) ── */
    .gallery { display:grid; grid-template-columns:repeat(3, 1fr); gap:2px; }
    /* fillers: quiet dark tiles that close the last row (not projects) */
    .filler {
      display:flex; flex-direction:column; justify-content:space-between;
      aspect-ratio:16/9; padding:20px 22px;
      background:#141414; color:var(--paper);
      text-decoration:none;
      opacity:0; animation:cardIn .7s cubic-bezier(.16,1,.3,1) forwards;
      transition:background .35s;
    }
    .filler.hide { display:none; }
    .filler small { font-size:12px; opacity:.35; }
    .filler b { font-weight:500; font-size:clamp(18px, 1.5vw, 26px); letter-spacing:-0.02em; line-height:1.1; opacity:.55; transition:opacity .35s; }
    .filler:hover b { opacity:1; }
    .filler b i { font-style:normal; display:inline-block; transition:transform .5s cubic-bezier(.2,.8,.2,1); }
    .filler:hover { background:#1b1b1b; }
    .filler:hover b i { transform:translate(4px, 2px); }
    .gallery-item {
      display:block; text-decoration:none; color:var(--paper);
      opacity:0; animation:cardIn .7s cubic-bezier(.16,1,.3,1) forwards;
    }
    .gallery-item.hide { display:none; }
    /* the gap between wave and grid: each row bleeds out as a blurred, dark echo of its first image */
    .gallery-item { position:relative; }
    .gallery-item.row-start::before {
      content:''; position:absolute; top:0; bottom:0;
      right:100%; width:calc(var(--gap) + 60px);
      background:var(--bleed) center / cover no-repeat;
      filter:blur(14px) brightness(.55) grayscale(1);
      transition:filter .6s ease;
      pointer-events:none;
    }
    /* the echo comes up in colour together with its project */
    .gallery-item.row-start:hover::before { filter:blur(14px) brightness(.8) grayscale(0); }
    @keyframes cardIn { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
    .project-container { position:relative; aspect-ratio:16/9; overflow:hidden; background:#0d0d0d; }
    .project-container::after {
      content:''; position:absolute; inset:0; z-index:4; pointer-events:none;
      border:1px solid rgba(238,235,229,.04); transition:border-color .3s;
    }
    .project-container:hover::after { border-color:rgba(238,235,229,.14); }
    .image-stack img {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      opacity:0; z-index:1;
      filter:grayscale(100%) brightness(.6);
      transition:opacity .45s ease, transform .6s cubic-bezier(.16,1,.3,1), filter .45s ease;
    }
    .image-stack img.active { opacity:1; z-index:2; }
    .project-container:hover .image-stack img.active { filter:grayscale(20%) brightness(.75); transform:scale(1.045); }
    .img-overlay {
      position:absolute; inset:0; z-index:3; pointer-events:none;
      background:linear-gradient(180deg, rgba(12,12,12,0) 30%, rgba(12,12,12,.72) 100%);
    }
    .project-info {
      position:absolute; left:0; right:0; bottom:0; z-index:5;
      padding:18px 22px 20px;
      transform:translateY(100%);
      transition:transform .38s cubic-bezier(.16,1,.3,1);
    }
    .project-container:hover .project-info { transform:none; }
    /* left column runs under the paper: keep its title clear of the seam */
    .gallery-item:nth-child(3n+1) .project-info { padding-left:22px; }
    @media (max-width:1200px) {
      .gallery-item:nth-child(3n+1) .project-info { padding-left:22px; }
      .gallery-item:nth-child(2n+1) .project-info { padding-left:22px; }
    }
    .project-title { font-weight:600; font-size:clamp(17px, 1.3vw, 22px); letter-spacing:-0.01em; line-height:1.15; margin-bottom:4px; }
    .work-description { font-size:12px; opacity:.55; }
    .cat-pill {
      position:absolute; top:14px; right:14px; z-index:5;
      font-size:11px; padding:3px 10px; border-radius:100px;
      border:1px solid rgba(238,235,229,.18); color:rgba(238,235,229,.7);
      background:rgba(12,12,12,.55);
      opacity:0; transition:opacity .3s;
    }
    .project-container:hover .cat-pill { opacity:1; }

    /* ── the lab (library from the current page, restyled) ── */
    .lab-head { padding:clamp(90px, 16vh, 180px) 0 clamp(24px, 4vh, 44px); }
    .lab-head h2 {
      font-weight:700;
      font-size:clamp(38px, 5vw, 96px);
      line-height:.9; letter-spacing:-0.04em;
    }
    .lab-head p { max-width:46ch; margin-top:14px; opacity:.6; }

    .lab-masonry { position:relative; visibility:hidden; }
    .lab-masonry.laid-out { visibility:visible; }
    .lm-wrap { position:absolute; }
    .lab-card { position:relative; overflow:hidden; background:#151515; cursor:pointer; user-select:none; }
    .lab-card img, .lab-card video {
      display:block; width:100%; height:auto; max-height:70vh; object-fit:cover;
      filter:grayscale(.8) brightness(.72) saturate(.8);
      transition:filter .45s ease, transform .55s cubic-bezier(.16,1,.3,1);
    }
    .lab-card:hover img, .lab-card:hover video { filter:grayscale(.1) brightness(.92) saturate(1.1); transform:scale(1.04); }
    .lab-overlay { position:absolute; inset:0; z-index:2; pointer-events:none; background:linear-gradient(180deg, transparent 45%, rgba(12,12,12,.88) 100%); opacity:0; transition:opacity .35s; }
    .lab-card:hover .lab-overlay { opacity:1; }
    .lab-info { position:absolute; left:0; right:0; bottom:0; z-index:3; padding:12px 14px 14px; color:var(--paper); transform:translateY(6px); opacity:0; transition:transform .32s cubic-bezier(.16,1,.3,1), opacity .28s; }
    .lab-card:hover .lab-info { transform:none; opacity:1; }
    .lab-title { font-weight:600; font-size:15px; line-height:1.2; }
    .lab-sub { font-size:12px; opacity:.55; margin-top:2px; }
    .lab-badge { position:absolute; top:10px; left:10px; z-index:3; font-size:11px; color:var(--paper); padding:2px 9px; border-radius:100px; background:rgba(12,12,12,.6); }

    /* lightbox */
    #lightbox { position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; background:rgba(12,12,12,.96); opacity:0; pointer-events:none; transition:opacity .38s cubic-bezier(.16,1,.3,1); color:var(--paper); }
    #lightbox.open { opacity:1; pointer-events:all; }
    #lb-stage { position:relative; width:min(88vw, 1200px); height:min(66vh, 780px); margin-top:-6vh; display:flex; align-items:center; justify-content:center; }
    #lb-media img, #lb-media video { display:block; max-width:min(88vw, 1200px); max-height:min(62vh, 760px); width:auto; height:auto; object-fit:contain; opacity:0; transition:opacity .32s ease; }
    #lb-media .ready { opacity:1; }
    .lb-arrow { position:absolute; top:50%; translate:0 -50%; width:44px; height:44px; border-radius:50%; border:1px solid rgba(238,235,229,.2); background:none; color:inherit; font:inherit; font-size:18px; cursor:pointer; opacity:.6; transition:opacity .2s; }
    .lb-arrow:hover { opacity:1; }
    #lb-prev { left:-64px; } #lb-next { right:-64px; }
    #lb-close { position:fixed; top:var(--pad); right:var(--pad); background:none; border:0; color:inherit; font:inherit; font-size:15px; cursor:pointer; border-bottom:1px solid currentColor; }
    #lb-count { position:fixed; top:var(--pad); left:50%; translate:-50% 0; font-size:13px; opacity:.45; }
    #lb-caption { position:fixed; bottom:40px; left:50%; translate:-50% 0; text-align:center; max-width:min(72vw, 860px); }
    #lb-title { font-weight:600; font-size:18px; }
    #lb-sub { font-size:13px; opacity:.55; margin-top:2px; }
    #lb-desc { font-size:14px; opacity:.7; margin-top:8px; line-height:1.6; }
    #lb-desc:empty { display:none; }

    footer { display:flex; justify-content:space-between; padding:clamp(60px, 10vh, 120px) var(--pad) var(--pad) calc(var(--inset) + 1vw); font-size:12px; opacity:.45; }

    @media (max-width:1200px) { .gallery { grid-template-columns:repeat(2, 1fr); } }
    @media (max-width:760px) {
      #page { grid-template-columns:1fr; }
      .strip { position:relative; height:auto; padding-bottom:12px; }
      .strip h1 { margin-top:56px; font-size:15vw; }
      .filters { flex-direction:row; flex-wrap:wrap; gap:6px 16px; margin-top:20px; }
      .to-lab { display:none; }
      main { padding-left:0; padding-top:12px; }
      #lab { padding:0 var(--pad); }
      footer { padding-left:var(--pad); }
      .gallery { grid-template-columns:1fr; gap:0; }
      .gallery-item { opacity:1; animation:none; }
      .project-info { transform:none; }
      .gallery-item .project-info { padding-left:22px !important; }
      #lb-prev { left:4px; } #lb-next { right:4px; }
      .lab-info, .lab-overlay { opacity:1; transform:none; }
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <div id="page">
    <aside class="strip ink-text fade-in">
      <a class="back" href="../index_new_c.html">← Back</a>
      <h1>Selected<br>work.</h1>
      <p class="count" id="count"></p>
      <ul class="filters" id="filters"></ul>
      <a class="to-lab" href="#lab">The Lab ↓</a>
    </aside>

    <main>
      <div class="gallery media" id="grid"></div>

      <section id="lab">
        <div class="lab-head ink-text">
          <h2>The Lab.</h2>
          <p id="lab-sub">Experiments, dailies and tests that didn't become a project — yet.</p>
        </div>
        <div class="lab-masonry media" id="masonry"></div>
      </section>

      <footer class="ink-text">
        <a href="../impressum/index.html" style="text-decoration:none">Impressum</a>
        <span>© 2026 JMG</span>
      </footer>
    </main>
  </div>

  <div id="lightbox" role="dialog" aria-label="Lab item">
    <button id="lb-close" type="button">Close</button>
    <div id="lb-count"></div>
    <div id="lb-stage">
      <button class="lb-arrow" id="lb-prev" type="button" aria-label="Previous">←</button>
      <div id="lb-media"></div>
      <button class="lb-arrow" id="lb-next" type="button" aria-label="Next">→</button>
    </div>
    <div id="lb-caption"><div id="lb-title"></div><div id="lb-sub"></div><div id="lb-desc"></div></div>
  </div>

  <script src="./projects.data.js"></script>
  <script src="../js/split-field.js"></script>
  <script>
  (() => {
    const D = PROJECTS_DATA;
    SplitField.init({ split: 0.22, splitMobile: 0.04, enterFrom: 0.5, lavaOver: true });

    // the redesigned Echoes page is the only draft so far; everything else links to the current pages
    const draftHref = href => /Echoes\/?$/.test(href) ? './Echoes/index_new.html' : href;

    /* ── project gallery (same markup + behaviour as the current page) ── */
    const grid = document.getElementById('grid');
    D.projects.forEach((p, i) => {
      const a = document.createElement('a');
      a.className = 'gallery-item';
      a.href = draftHref(p.href);
      a.dataset.category = p.category || '';
      a.style.animationDelay = (0.1 + i * 0.08).toFixed(2) + 's';
      if (p.images?.[0]) a.style.setProperty('--bleed', `url("${p.images[0].src}")`);
      const imgs = (p.images || []).map((im, j) => `<img src="${im.src}" alt="${im.alt || ''}"${j === 0 ? ' class="active"' : ''}>`).join('');
      a.innerHTML = `
        <div class="project-container">
          <div class="image-stack">${imgs}</div>
          <div class="img-overlay"></div>
          ${p.pill ? `<span class="cat-pill">${p.pill}</span>` : ''}
          <div class="project-info">
            <div class="project-title">${p.title || ''}</div>
            <div class="work-description">${p.desc || ''}</div>
          </div>
        </div>`;
      // flipbook: images step through while hovered
      const stack = [...a.querySelectorAll('.image-stack img')];
      let k = 0, iv = null;
      a.addEventListener('mouseenter', () => {
        if (stack.length < 2) return;
        iv = setInterval(() => { stack[k].classList.remove('active'); k = (k + 1) % stack.length; stack[k].classList.add('active'); }, 800);
      });
      a.addEventListener('mouseleave', () => { clearInterval(iv); stack[k].classList.remove('active'); k = 0; stack[0]?.classList.add('active'); });
      grid.appendChild(a);
    });

    /* ── filters ── */
    const cards = [...grid.children];
    const countEl = document.getElementById('count');
    const setCount = () => {
      const n = cards.filter(c => !c.classList.contains('hide')).length;
      countEl.textContent = `${n} project${n === 1 ? '' : 's'}`;
    };
    const filters = document.getElementById('filters');
    [{ label: 'All', value: 'all' }, ...D.filters].forEach((f, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.textContent = f.label;
      if (i === 0) b.classList.add('on');
      b.addEventListener('click', () => {
        filters.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        cards.forEach(c => c.classList.toggle('hide', f.value !== 'all' && !c.dataset.category.split(' ').includes(f.value)));
        setCount();
      });
      li.appendChild(b);
      filters.appendChild(li);
    });
    setCount();

    /* ── close the last row with paper tiles ── */
    const FILLERS = [
      { href: '#lab', small: 'Experiments & side work', title: 'The Lab <i>↓</i>' },
      { href: 'mailto:jonamelvingrobe@gmail.com?subject=Project%20Inquiry', small: 'Next one could be yours', title: 'Get in touch <i>→</i>' },
    ];
    const fillers = FILLERS.map(f => {
      const a = document.createElement('a');
      a.className = 'filler hide';
      a.href = f.href;
      a.innerHTML = `<small>${f.small}</small><b>${f.title}</b>`;
      grid.appendChild(a);
      return a;
    });
    function fillRows() {
      const visCards = cards.filter(c => !c.classList.contains('hide'));
      const vis = visCards.length;
      const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
      // first card of every row feeds the blurred bleed in the gap next to the wave
      cards.forEach(c => c.classList.remove('row-start'));
      if (cols > 1) visCards.forEach((c, i) => { if (i % cols === 0) c.classList.add('row-start'); });
      const empty = cols < 2 ? 0 : (cols - vis % cols) % cols;
      fillers.forEach((f, i) => f.classList.toggle('hide', i >= empty));
    }
    fillRows();
    filters.addEventListener('click', () => requestAnimationFrame(fillRows));
    let fr; addEventListener('resize', () => { clearTimeout(fr); fr = setTimeout(fillRows, 80); });

    /* ── the lab: masonry, lazy videos, lightbox (same behaviour as the current page) ── */
    if (D.labDivider?.sub) document.getElementById('lab-sub').textContent = D.labDivider.sub;
    const masonry = document.getElementById('masonry');
    const items = (D.lab || []).filter(it => it.src);
    masonry.innerHTML = items.map((it, i) => `
      <div class="lm-wrap"><div class="lab-card" data-i="${i}">
        ${it.type === 'video'
          ? `<video data-src="${it.src}" autoplay muted loop playsinline></video><span class="lab-badge">Video</span>`
          : `<img src="${it.src}" alt="${it.title || ''}" loading="lazy">`}
        <div class="lab-overlay"></div>
        <div class="lab-info"><div class="lab-title">${it.title || ''}</div><div class="lab-sub">${it.sub || ''}</div></div>
      </div></div>`).join('');

    const GAP = 3;
    function layout() {
      const wraps = [...masonry.children];
      const w = innerWidth, cols = w <= 760 ? 1 : w <= 1100 ? 2 : w <= 1500 ? 3 : 4;
      const colW = (masonry.offsetWidth - GAP * (cols - 1)) / cols, colY = new Array(cols).fill(0);
      wraps.forEach(el => { el.style.width = colW + 'px'; });
      wraps.forEach((el, i) => {
        const c = colY.indexOf(Math.min(...colY));             // shortest column first
        el.style.left = c * (colW + GAP) + 'px';
        el.style.top = colY[c] + 'px';
        colY[c] += el.offsetHeight + GAP;
      });
      masonry.style.height = Math.max(0, Math.max(...colY) - GAP) + 'px';
      masonry.classList.add('laid-out');
    }
    let lt;
    const relayout = () => { clearTimeout(lt); lt = setTimeout(layout, 60); };
    layout(); setTimeout(layout, 300); setTimeout(layout, 900);
    addEventListener('resize', relayout);
    masonry.querySelectorAll('img').forEach(im => im.addEventListener('load', relayout));

    const vids = masonry.querySelectorAll('video[data-src]');
    const lazy = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const v = e.target; v.src = v.dataset.src; v.load();
      v.addEventListener('loadedmetadata', relayout, { once: true });
      lazy.unobserve(v);
    }), { rootMargin: '400px' });
    vids.forEach(v => lazy.observe(v));

    const lb = document.getElementById('lightbox'), lbMedia = document.getElementById('lb-media');
    let cur = 0;
    function show(i) {
      cur = (i + items.length) % items.length;
      const it = items[cur];
      lbMedia.innerHTML = '';
      const el = it.type === 'video'
        ? Object.assign(document.createElement('video'), { src: it.src, autoplay: true, loop: true, controls: true, playsInline: true })
        : Object.assign(document.createElement('img'), { src: it.src, alt: it.title || '' });
      el.addEventListener(it.type === 'video' ? 'canplay' : 'load', () => el.classList.add('ready'), { once: true });
      if (el.complete) el.classList.add('ready');
      lbMedia.appendChild(el);
      document.getElementById('lb-title').textContent = it.title || '';
      document.getElementById('lb-sub').textContent = it.sub || '';
      document.getElementById('lb-desc').textContent = it.desc || '';
      document.getElementById('lb-count').textContent = `${cur + 1} / ${items.length}`;
      document.body.style.overflow = 'hidden';
      lb.classList.add('open');
    }
    function close() {
      lb.classList.remove('open'); document.body.style.overflow = '';
      setTimeout(() => { lbMedia.innerHTML = ''; }, 350);
    }
    masonry.addEventListener('click', e => { const c = e.target.closest('.lab-card'); if (c) show(+c.dataset.i); });
    document.getElementById('lb-prev').addEventListener('click', () => show(cur - 1));
    document.getElementById('lb-next').addEventListener('click', () => show(cur + 1));
    document.getElementById('lb-close').addEventListener('click', close);
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'ArrowLeft') show(cur - 1);
      if (e.key === 'ArrowRight') show(cur + 1);
      if (e.key === 'Escape') close();
    });
    let tx = 0;
    lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) show(dx < 0 ? cur + 1 : cur - 1); });
  })();
  </script>
</body>
</html>
